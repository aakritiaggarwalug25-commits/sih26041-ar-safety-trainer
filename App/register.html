<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — SafeAR Industrial Training</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="app-nav">
        <a class="brand" href="index.html">
            <span class="brand-mark">🛡️</span>
            <div>
                <strong>Safe<span>AR</span></strong>
                <small>Industrial Safety Training</small>
            </div>
        </a>
        <div>
            <a href="login.html" class="app-nav-link">Sign In</a>
        </div>
    </header>

    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-brand">
                <div class="footer-brand" style="font-size:32px; justify-content:center; margin-bottom:8px;">
                    Safe<span>AR</span>
                </div>
                <p class="auth-subtitle" style="color:var(--text-muted); font-size:14px; margin:0;">
                    Industrial Safety Assessment Platform
                </p>
            </div>

            <form class="auth-form" id="registerForm" autocomplete="on">
                <h2>Create Account</h2>
                <p class="auth-hint">Register to access AR simulations and certified performance records.</p>

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="e.g. Ramesh Kumar" autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Work Email</label>
                    <input type="email" id="email" name="email" required placeholder="name@organization.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Minimum 6 characters" minlength="6" autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="organization">Organization / Facility</label>
                    <input type="text" id="organization" name="organization" required placeholder="e.g. Bharat Mining Corp / Plant 4">
                </div>

                <div class="form-group">
                    <label for="role">Account Role</label>
                    <select id="role" name="role" required style="cursor:pointer;">
                        <option value="trainee">Trainee (Worker — Simulations &amp; Personal Telemetry)</option>
                        <option value="trainer">Trainer (Instructor — Analytics Dashboard &amp; Audits)</option>
                    </select>
                </div>

                <div id="errorMsg" class="auth-error" style="display:none;"></div>
                <div id="successMsg" class="auth-success" style="display:none;"></div>

                <button type="submit" class="auth-btn" id="registerBtn" style="width:100%; margin-top:8px;">
                    <span class="btn-text">Create Account →</span>
                    <span class="btn-loading" style="display:none;">Provisioning Account…</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already registered? <a href="login.html">Sign In</a></p>
                <a href="index.html" class="auth-back">← Back to Home</a>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-brand">Safe<span>AR</span></div>
        <p>Industrial Safety Training Platform &middot; SIH26041</p>
        <a href="index.html">Back to Home</a>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/engine/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function traineeLandingPage() {
            return I18n.hasLang() ? "scenarios.html" : "language.html";
        }

        // If already logged in, redirect
        if (SafeAuth.isLoggedIn()) {
            const user = SafeAuth.getUser();
            if (user && user.role === "trainer") {
                window.location.href = "../dashboard/dashboard.html";
            } else {
                window.location.href = traineeLandingPage();
            }
        }

        const form = document.getElementById("registerForm");
        const errorMsg = document.getElementById("errorMsg");
        const successMsg = document.getElementById("successMsg");
        const registerBtn = document.getElementById("registerBtn");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorMsg.style.display = "none";
            successMsg.style.display = "none";

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const organization = document.getElementById("organization").value.trim();
            const role = document.getElementById("role").value;

            // Show loading state
            registerBtn.querySelector(".btn-text").style.display = "none";
            registerBtn.querySelector(".btn-loading").style.display = "inline";
            registerBtn.disabled = true;

            const result = await SafeAuth.register(name, email, password, organization, role);

            if (result.success) {
                successMsg.textContent = "Account created! Signing you in…";
                successMsg.style.display = "block";

                // Auto-login after registration
                const loginResult = await SafeAuth.login(email, password);
                if (loginResult.success) {
                    const loggedUser = loginResult.user || {};
                    const roleVal = (loggedUser.role || "").trim().toLowerCase();
                    if (roleVal === "trainer" || roleVal === "admin") {
                        window.location.href = "../dashboard/dashboard.html";
                    } else {
                        window.location.href = traineeLandingPage();
                    }
                } else {
                    successMsg.textContent = "Account created! Please sign in.";
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1200);
                }
            } else {
                errorMsg.textContent = result.message || "Registration failed. Please try again.";
                errorMsg.style.display = "block";
                registerBtn.querySelector(".btn-text").style.display = "inline";
                registerBtn.querySelector(".btn-loading").style.display = "none";
                registerBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
